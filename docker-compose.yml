services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BOOKING_URL: ${VITE_BOOKING_URL:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
