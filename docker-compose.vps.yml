# R.U.N. auf einem VPS, auf dem schon ein nginx die Ports 80/443 belegt (z. B. der Container
# 1512dd-frontend-1). Kein Caddy: Das Frontend lauscht nur auf der Docker-Bridge 172.18.0.1:8080,
# der vorhandene nginx leitet run.dennisrapp.com per proxy_pass dorthin und holt das Zertifikat per certbot.
#
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Eigenes Compose-Projekt "run" mit eigenem Netz: Die Dienste backend/frontend sind nur dort sichtbar
# und kollidieren nicht mit gleichnamigen Diensten anderer Projekte.
name: run

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "172.18.0.1:8080:80"
    volumes:
      # Werbekarte der Agentur: Datei bearbeiten (git pull), ohne Neubau live. Ein Verzeichnis, keine Einzeldatei,
      # damit ein git pull (ersetzt die Datei) im Container sichtbar bleibt.
      - ./frontend/public/promo:/usr/share/nginx/html/promo:ro
    mem_limit: 128m
    logging: *logging
    depends_on:
      - backend
    restart: unless-stopped
